maintenance = "%prefix%&cLa %crate% &cest en maintenance. Votre clé n'a pas été consommée."
maintenance_global = "%prefix%&cLes caisses sont en maintenance. Votre clé n'a pas été consommée."
no_key = "%prefix%&cIl vous faut &f%need% × %key%&c pour ouvrir cette caisse."
bad_key = "%prefix%&cClé introuvable pour cette caisse (%key%). Prévenez un administrateur."
