too_far = "%prefix%&cApprochez-vous de la caisse pour l'ouvrir."
busy = "%prefix%&cUne ouverture est déjà en cours."
empty = "%prefix%&cCette caisse ne contient aucune récompense."
remote = "%prefix%&7Aperçu à distance : rendez-vous à la caisse pour l'ouvrir."
error = "%prefix%&cAucune récompense n'a pu être préparée (%error%). Votre clé n'a pas été consommée."
won = "%prefix%&7Vous avez obtenu %reward% &7!"
announce = "<#FFD24A>✦</#> &e%player% &7a obtenu %reward% &7dans la %crate%&7 !"
toggled_on = "%prefix%&cMaintenance activée pour la caisse &f%crate%&c."
toggled_off = "%prefix%&aMaintenance désactivée pour la caisse &f%crate%&a."
toggled_all_on = "%prefix%&cMaintenance globale activée : toutes les caisses sont verrouillées."
toggled_all_off = "%prefix%&aMaintenance globale désactivée."
givekey = "%prefix%&a%count% × %key% &adonnée(s) à &f%player%&a."
givekey_received = "%prefix%&7Vous avez reçu &f%count% × %key%&7."
unknown_key = "%prefix%&cClé inconnue : &f%key% &7(obsidienne, songes, racine, givre_etoile, solaire, profondeurs, ombre, temps, celeste, coeur_dragon ou nom d'une caisse)."
list_header = "%prefix%&f%count% caisses%maint%"
list_entry = "&8- &f%crate% &7(%name%&7) &8: &7%rewards% récompenses, %links% conteneur(s)%maint%"

[builder]
prefix = "<#C9B8FF>✦ Vœu ADN</#> &8» &7"
disabled = "%prefix_adn%&cLe menu Vœu ADN est désactivé."
refused = "%prefix_adn%&c%reason%"
