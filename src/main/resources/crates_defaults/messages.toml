# =====================================================================
#  CobblePulse Crates - Messages
#  Codes couleur : &a, &l, &#RRGGBB et <#RRGGBB>texte</#>. Variables : %nom%.
#  %prefix% est remplace par general.prefix, %prefix_adn% par builder.prefix.
# =====================================================================

[general]
prefix = "<#B48CF0>✦ Caisses</#> &8» &7"
no_permission = "%prefix%&cVous n'avez pas la permission."
players_only = "%prefix%&cCommande réservée aux joueurs."
no_client = "%prefix%&cCet écran nécessite le mod CobblePulse Crates côté client (modpack)."
reloaded = "%prefix%&aConfiguration rechargée : &f%crates% caisses&a, &f%pools% pools&a, &f%links% conteneurs liés&a."

[caisse]
unknown = "%prefix%&cCaisse inconnue : &f%crate%"
not_container = "%prefix%&cVisez un conteneur (coffre, tonneau, coffre de l'Ender...) à moins de 6 blocs."
linked = "%prefix%&aConteneur lié à la caisse &f%crate% &8(%world% %x% %y% %z%)&a."
already_linked = "%prefix%&cCe conteneur est déjà lié à la caisse &f%crate%&c."
unlinked = "%prefix%&aConteneur délié de la caisse &f%crate%&a."
